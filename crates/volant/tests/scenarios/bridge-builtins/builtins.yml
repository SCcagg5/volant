- hosts: h1
  gather_facts: false
  tasks:
    - name: A filter
      debug:
        msg: "{{ [1, 2, 3] | combinations(2) | list }}"
    - name: A test
      debug:
        msg: "{{ '/a' is abs }}, {{ 'a' is ansible.builtin.abs }}"
    - name: A lookup joins its strings
      debug:
        msg: "{{ lookup('sequence', 'start=1 end=3') }}"
    - name: A query keeps the list
      debug:
        msg: "{{ query('sequence', 'start=1 end=3') }}"
    - name: So does q
      debug:
        msg: "{{ q('ansible.builtin.sequence', 'count=2') }}"
    - name: A native lookup through query
      debug:
        msg: "{{ query('vars', 'inventory_hostname') }}"
    - name: A test named by select
      debug:
        msg: "{{ ['/a', 'b'] | select('abs') | list }}"
