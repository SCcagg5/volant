- hosts: all
  gather_facts: false
  vars:
    limit: 1
  tasks:
    - name: a when inside apply is checked for each task
      include_tasks:
        file: inc.yml
        apply:
          when: inventory_hostname == 'h1'
    - name: a when on the statement is checked once
      include_tasks:
        file: inc.yml
        apply:
          when: limit > 5
      when: limit < 5
