- hosts: all
  gather_facts: false
  tasks:
    - name: apply vars and ignore_errors
      include_tasks:
        file: kw-inc.yml
        apply:
          vars:
            v: from-apply
          ignore_errors: true
    - name: the statement's own vars win over apply vars
      include_tasks:
        file: kw-inc.yml
        apply:
          vars:
            v: from-apply
          ignore_errors: true
      vars:
        v: from-statement
