- hosts: h1
  gather_facts: false
  vars:
    all_groups: "{{ groups | dict2items | map(attribute='key') | sort | join(',') }}"
  tasks:
    - name: One host records the text
      command: cat {{ playbook_dir }}/key.txt
      register: r
    - name: A group is named after it
      group_by:
        key: "{{ r.stdout }}"
      changed_when: false
    - name: A parent group is named after it
      group_by:
        key: kind
        parents: ["{{ r.stdout }}"]
      changed_when: false
    - name: The groups are read through a variable of the play
      debug:
        msg: "{{ all_groups }}"
    - name: The group names are listed
      debug:
        msg: "{{ groups.keys() | list | sort | join(',') }}"
    - name: The group names are looped over
      debug:
        msg: "{{ item }}"
      loop: "{{ groups.keys() | list | sort }}"
    - name: The host reads its own groups
      debug:
        msg: "{{ group_names | sort | join(',') }}"

- hosts: h1
  gather_facts: false
  tasks:
    - name: The next play reads them again
      debug:
        msg: "{{ group_names | sort | join(',') }} {{ groups.keys() | list | sort | join(',') }}"
