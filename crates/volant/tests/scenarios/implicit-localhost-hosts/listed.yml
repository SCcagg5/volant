- hosts: localhost
  gather_facts: false
  tasks:
    - debug:
        msg: "{{ inventory_hostname }} {{ marker }} {{ ansible_play_hosts }}"
- hosts: ::1
  gather_facts: false
  tasks:
    - debug:
        msg: "{{ inventory_hostname }} {{ marker }}"
- hosts: 127.0.0.1
  gather_facts: false
  tasks:
    - debug:
        msg: "{{ inventory_hostname }} {{ marker }}"
- hosts: h1
  gather_facts: false
  tasks:
    - command: "true"
      delegate_to: localhost
    - command: "true"
      delegate_to: 127.0.0.1
    - debug:
        msg: "{{ ansible_play_hosts }}"
- hosts: web:!localhost
  gather_facts: false
  tasks:
    - debug:
        msg: "{{ inventory_hostname }}"
